name: CI

# First CI this repo has ever had — see docs/plans/e2e-testing-plan.md's
# D6. Runs on every PR (to any base branch) and every push to develop/main.
#
# One secret required: STRIPE_SECRET_KEY (a Stripe TEST-mode key, repo
# Actions secret — found necessary on this workflow's first real run, not
# assumed: backend/tests/routes/{paymentMethod,registration,privateClass*}
# and their service-level twins call real Stripe TEST-mode APIs by this
# repo's own deliberate, documented convention (docs/TESTING_STRATEGY.md's
# Mocking rules — Stripe is never mocked, to avoid drifting from its real
# API contract) — same as every other backend test file, which are fully
# mocked (mongodb-memory-server + MSW) and need nothing extra. The E2E job
# never talks to a real database, Stripe, or staging
# (frontend/e2e/fixtures/mock-api.ts), so it needs no secret either. Note
# this key already lives in Vercel's own env vars for the deployed
# backend — that's a separate store GitHub Actions cannot read, so it had
# to be added here too via `gh secret set`, not assumed already available.
#
# NOTE ON THIS WORKFLOW BECOMING AN ACTUAL GATE: this file alone only makes
# these checks run and report status on a PR. Making a red run actually
# block a merge requires enabling "required status checks" under
# Settings -> Branches for develop/main — a GitHub repo-settings action
# only the owner can take. Mark ONE check as required: ci-passed (the last
# job below), which fails unless every test job succeeded.
#
# GATES (docs/plans/testing-strategy-refresh-plan.md PR A):
#   - backend-tests / frontend-tests run each suite ONCE, with coverage, and
#     fail below the 80% statements floor (coverageThreshold in each
#     jest.config.js). The coverage summary goes to the job summary.
#   - frontend-tests type-checks the whole app AND e2e/ first — neither Jest
#     nor next build type-checks test files or the E2E mocks.
#   - backend-tests runs scripts/check-route-existence.mjs: every frontend
#     api.<method>() call and every E2E mock route must match a real backend
#     route (live Express introspection; exit 2 on any extraction failure).

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Tests with coverage (80% statements floor)
        run: |
          npm run test:coverage | tee coverage-output.txt
          { echo '## Backend coverage'; echo '```'; grep -A5 'Coverage summary' coverage-output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        working-directory: backend
        env:
          TZ: UTC
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      - name: Route-existence guard
        run: |
          node scripts/check-route-existence.mjs --self-test
          node scripts/check-route-existence.mjs --frontend frontend --backend backend

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Type check (app + e2e)
        run: npm run typecheck
        working-directory: frontend
      - name: Tests with coverage (80% statements floor)
        run: |
          npm run test:coverage | tee coverage-output.txt
          { echo '## Frontend coverage'; echo '```'; grep -A5 'Coverage summary' coverage-output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        working-directory: frontend
        env:
          TZ: UTC

  e2e-tests:
    runs-on: ubuntu-latest
    # Runs inside the official Playwright image, exactly version-matched to
    # frontend/package.json's pinned @playwright/test (D11) — browsers are
    # already installed in the image (no download/cache step needed), and
    # critically, this is what makes the committed screenshot baselines
    # (frontend/e2e/*.spec.ts-snapshots/) actually reproducible: Chromium's
    # font rendering differs enough between Windows/macOS/Linux that a
    # baseline generated anywhere else would fail here for the wrong
    # reason. Bump this tag in lockstep with BOTH @playwright/test and
    # playwright-core in frontend/package.json —
    # frontend/lib/__tests__/guards/playwrightVersionGuard.test.ts fails the
    # frontend job if the three ever differ.
    container:
      image: mcr.microsoft.com/playwright:v1.47.2-jammy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # The live-gate runner's offline tests (docs/plans/playwright-live-gates-
  # plan.md §3): node --test over audit/tests, no browser, no staging, no
  # secrets. `npm ci` downloads no browsers — the pinned playwright package
  # has no install hook. The gate scripts themselves need staging and run by
  # hand (`npm run gate -- <id> --headed`); their selectors are checked by
  # frontend-tests' auditSelectorGuard.
  audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: audit/package-lock.json
      - run: npm ci
        working-directory: audit
      - run: npm test
        working-directory: audit
        env:
          TZ: UTC

  # The ONE check the owner marks as required (Settings → Branches →
  # "Require status checks to pass" → ci-passed, for develop and main) —
  # docs/plans/testing-strategy-refresh-plan.md PR E. `if: always()` matters:
  # without it this job is SKIPPED when a dependency fails, and GitHub treats
  # a skipped required check as passing. It succeeds only when every job it
  # needs succeeded; a new test job is added to `needs` in the PR that adds it.
  ci-passed:
    if: always()
    needs: [backend-tests, frontend-tests, e2e-tests, audit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job finished with '$result'"
              exit 1
            fi
          done
